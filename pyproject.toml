[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yurhedgefundai"
version = "0.1.0"
description = "Research-first, multi-agent hedge fund intelligence platform — paper-trading only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "data", "pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["core", "agents", "data", "pipelines", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
