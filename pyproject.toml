[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yurhedgefundai"
version = "0.1.0"
description = "Research-first, multi-agent hedge fund intelligence platform — paper-trading only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "langgraph>=1.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.23",
    "mypy>=1.11",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]
# Optional runtime fallback for the Fundamentals analyst (agents/research/
# fundamentals.py): used only when FMP_API_KEY is unset. Tests stub it, so
# it is never needed for offline CI.
yfinance = ["yfinance>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "data", "pipelines", "storage"]

# Versioned prompts are data, not a package — force-include so an installed
# wheel resolves agents/base.py's PROMPTS_DIR (site-packages/prompts).
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["core", "agents", "data", "pipelines", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
