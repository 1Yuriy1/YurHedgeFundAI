# Local infrastructure for YurHedgeFundAI (Phases 1–2: no app container yet —
# the pipeline runs on the host and talks to these two services).
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: yhf
      POSTGRES_PASSWORD: yhf
      POSTGRES_DB: yhf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # pgvector-ready audit schema (signals, score_records) provisioned on first boot.
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yhf -d yhf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
